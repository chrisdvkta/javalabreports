services:
  mysql:
    image: mysql:8.4
    container_name: ajp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ajp
      MYSQL_USER: ajp
      MYSQL_PASSWORD: ajp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${AJP_MYSQL_PORT:-3310}:3306"
    volumes:
      - ajp_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ajp_mysql_data:
